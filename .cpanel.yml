# cPanel Git Version Control deployment: copies the site files from the
# server-side clone (~/repositories/camper-samobor.com) into the live document root.
#
# camper-samobor.com is the primary domain of the account, so its document root
# is public_html. The host has no rsync, so this copies an explicit list with cp.
# Anything not listed (.github/, *.md) stays out of the docroot. Server-only
# files (.well-known/, cgi-bin/, addon-domain folders) are not in git, so cp never
# overwrites them. Nothing is deleted: a file removed from the repo must also be
# removed from the server by hand. A new top-level file or folder must be added
# to the list below.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/camper/public_html/
    - /bin/cp -R .htaccess *.html css js images en $DEPLOYPATH
